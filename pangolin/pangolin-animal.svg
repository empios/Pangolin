<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="body">
      <circle cx="14" cy="16" r="10"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#2C001E"/>

  <!-- Curled body -->
  <circle cx="14" cy="16" r="10" fill="#77216F"/>

  <!-- Snout (elongated, tapering right) -->
  <path d="M 22 17 C 24 15,29 15.5,29.5 18.5 C 29 22,24.5 22,22 20 Z" fill="#5A0F4D"/>

  <!-- Scale rows, clipped to body -->
  <g clip-path="url(#body)">
    <path d="M 5 10 Q 14 7 23 10"   stroke="#E95420" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M 4 14 Q 14 11 24 14"  stroke="#E95420" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <path d="M 4 18 Q 14 15 24 18"  stroke="#FF7848" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <path d="M 5 22 Q 14 19 23 22"  stroke="#FF7848" stroke-width="1"   fill="none" stroke-linecap="round"/>
    <path d="M 7 25.5 Q 14 23 21 25.5" stroke="#FFAE85" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Eye -->
  <circle cx="26" cy="15" r="1.3" fill="#FAF7F4"/>

  <!-- Nostril -->
  <circle cx="29" cy="19" r="0.6" fill="#2C001E"/>
</svg>
